# 발행 URL: https://sunghyunheo.github.io/writing-contests/
name: daily-contests

on:
  schedule:
    # 매일 09:00 KST (= 00:00 UTC). 공모전은 마감일 단위라 아침에 한 번이면 충분하다.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-contests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 마감일 파서가 깨지면 잘못된 D-Day 가 나가므로 먼저 검증한다.
      - name: 마감일 파서 테스트
        run: python test_deadline.py

      - name: 공모전 수집
        run: python collect.py

      - name: 페이지 렌더링
        run: python render.py

      - name: 아카이브 커밋
        run: |
          git config user.name  "contest-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "chore: $(TZ=Asia/Seoul date +%F) 공모전 일정 갱신"
          git push

      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs

      - name: Pages 미설정 안내
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages 가 꺼져 있어 배포를 건너뜁니다."
          echo "Settings > Pages > Source 를 'GitHub Actions' 로 바꾸세요."

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
